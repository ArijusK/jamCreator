services:
  postgres:
    image: postgres:16
    container_name: jamcreator-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: JamCreatorDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - jamcreator_postgres_data:/var/lib/postgresql/data

volumes:
  jamcreator_postgres_data: